[package]
name = "celestial-solver"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Astronomical Plate Solving"
keywords = ["astronomy", "astrometry", "plate-solving", "GAIA", "fits"]
categories = ["science"]

[[bin]]
name = "image-solver"
path = "src/bin/solve/main.rs"
required-features = ["cli"]

[dependencies]
celestial-core.workspace = true
celestial-time.workspace = true
celestial-coords.workspace = true
celestial-catalog.workspace = true
celestial-wcs.workspace = true
celestial-images = { workspace = true, features = ["standard-formats"] }

libm.workspace = true
log.workspace = true
rayon.workspace = true
thiserror.workspace = true

# Only needed for the image-solver binary
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }

[dev-dependencies]
celestial-catalog = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
tempfile.workspace = true

[features]
default = []
cli = ["dep:anyhow", "dep:clap", "dep:env_logger"]
