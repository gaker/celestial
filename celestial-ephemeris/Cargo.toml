[package]
name = "celestial-ephemeris"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Astronomical ephemeris calculations"
keywords = ["astronomy", "ephemeris", "planets", "vsop", "celestial"]
categories = ["science"]
exclude = ["tests/data/de432s.bsp"]

[features]
serde = ["celestial-time/serde", "celestial-core/serde"]
cli = ["dep:clap", "dep:reqwest"]

[dependencies]
celestial-core.workspace = true
celestial-time.workspace = true
libm.workspace = true
clap = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["blocking"] }
thiserror.workspace = true
wide.workspace = true

[[bin]]
name = "vsop2013-gen"
path = "src/bin/vsop2013_gen/main.rs"
required-features = ["cli"]

[[bin]]
name = "elpmpp02-gen"
path = "src/bin/elpmpp02_gen/main.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile.workspace = true


