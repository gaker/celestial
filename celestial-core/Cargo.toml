[package]
name = "celestial-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types and utilities for the Celestial astronomy library"
keywords = ["astronomy", "celestial", "astrometry", "science"]
categories = ["science"]

[dependencies]
libm.workspace = true
once_cell.workspace = true
regex.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[features]
default = []
serde = ["dep:serde"]
# Exposes test_helpers and nutation internals to sibling crates' tests and erfa-sys
test-support = []

[dev-dependencies]
criterion.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bench]]
name = "nutation"
harness = false

[[bench]]
name = "precession"
harness = false

[[bench]]
name = "cio"
harness = false

[[bench]]
name = "matrix"
harness = false
