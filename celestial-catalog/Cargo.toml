[package]
name = "celestial-catalog"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Astronomical Catalog operations"
keywords = ["astronomy", "coordinates", "celestial", "astrometry", "GAIA"]
categories = ["science"]

[[bin]]
name = "forge"
path = "src/bin/forge/main.rs"
required-features = ["cli"]

[[bin]]
name = "query-catalog"
path = "src/bin/query/main.rs"
required-features = ["cli"]

[dependencies]
celestial-core.workspace = true
celestial-time.workspace = true
celestial-coords.workspace = true
libm.workspace = true
memmap2.workspace = true
thiserror.workspace = true

# CLI and pipeline dependencies (only needed for the forge and query-catalog binaries)
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
quick-xml = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
integration-tests = []
# Exposes query::test_support, which writes small catalog files, to sibling crates' tests
test-support = []
cli = ["dep:anyhow", "dep:clap", "dep:flate2", "dep:rayon", "dep:indicatif", "dep:serde", "dep:serde_json", "dep:reqwest", "dep:quick-xml"]
